let order=[],index=0,revealed=false;
const $=id=>document.getElementById(id);
function makeOrder(){order=[...Array(STATES.length).keys()];if($('shuffle').checked){for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}}
function show(){
const item=STATES[order[index]];revealed=false;
$('shape').setAttribute('d',item.path);$('name').textContent=item.name;
$('answer').classList.add('hidden');$('hint').textContent='Say the state name out loud, then reveal!';
$('reveal').disabled=false;$('reveal').textContent='👀 Reveal Answer';$('next').disabled=true;
$('count').textContent=(index+1)+' of 50';$('progress').style.width=(index/50*100)+'%';$('track').setAttribute('aria-valuenow',index);
}
function reveal(){if(revealed)return;revealed=true;$('answer').classList.remove('hidden');$('hint').textContent='The answer is…';$('reveal').disabled=true;$('reveal').textContent='⭐ Answer Revealed';$('next').disabled=false;$('next').textContent=index===49?'Finish! 🎉':'Next State →';$('next').focus()}
function next(){if(!revealed)return;index++;if(index>=STATES.length){finish();return}show()}
function finish(){$('progress').style.width='100%';$('track').setAttribute('aria-valuenow',50);$('game').innerHTML='<div class="complete"><div class="big">🏆 🎉</div><h2>You explored all 50 states!</h2><p>Fantastic work, geography explorer! Ready for another round?</p><button class="primary" onclick="location.reload()">Play Again ↻</button></div>'}
function restart(){location.reload()}
$('reveal').addEventListener('click',reveal);$('next').addEventListener('click',next);$('restart').addEventListener('click',restart);
$('shuffle').addEventListener('change',()=>{makeOrder();index=0;show()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;if(e.code==='Space'&&!revealed){e.preventDefault();reveal()}else if(e.key==='Enter'&&revealed){e.preventDefault();next()}});
makeOrder();show();
</script></body></html>
